<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — {{ app_name }}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="{% block body_class %}{% endblock %}">

<nav class="navbar">
    <div class="container nav-inner">
        <a href="/" class="logo">
            <i class="fas fa-book-open"></i>
            <span>{{ app_name }}</span>
        </a>

        <ul class="nav-links">
            <li><a href="/"><i class="fas fa-home"></i> الرئيسية</a></li>
            {% for cat in categories %}
                <li><a href="/category/{{ cat }}">{{ cat }}</a></li>
            {% endfor %}
        </ul>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div class="container">
        <p>© {{ year }} {{ app_name }} — اقرأ، تخيل، اسبح في الخيال</p>
    </div>
</footer>

</body>
</html>
